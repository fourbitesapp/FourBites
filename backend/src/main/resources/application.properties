spring.application.name=fourbites-backend

server.port=${PORT:8080}

spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fourbites}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.frontend-url=${FRONTEND_URL:http://localhost:5173}

app.jwt.secret=${JWT_SECRET}
app.jwt.validade-horas=24

app.brevo.api-key=${BREVO_API_KEY:}
app.email.remetente=${EMAIL_REMETENTE:}
app.recuperacao.validade-minutos=30